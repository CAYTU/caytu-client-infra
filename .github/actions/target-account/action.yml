name: Work out whose account this is
description: >
  Turn a target AWS account id into the role to assume there. One secret holds
  every customer, so onboarding one does not mean inventing a secret name that
  somebody has to remember to create.

inputs:
  target_account_id:
    description: "AWS account to act in. Empty means our own, which is the Caytu-hosted case."
    required: false
    default: ""
  accounts_json:
    description: 'JSON: {"<account id>": {"role_arn": "...", "external_id": "...", "permissions_boundary": "..."}}'
    required: false
    default: ""

outputs:
  assume_role_arn:
    description: "Empty on the hosted path."
    value: ${{ steps.resolve.outputs.assume_role_arn }}
  external_id:
    description: "Masked in the log. Empty on the hosted path."
    value: ${{ steps.resolve.outputs.external_id }}
  permissions_boundary:
    description: "Required on every role we create in a customer account."
    value: ${{ steps.resolve.outputs.permissions_boundary }}
  create_ssh_key_pair:
    description: "False for a customer account, where Session Manager is the way in."
    value: ${{ steps.resolve.outputs.create_ssh_key_pair }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        TARGET: ${{ inputs.target_account_id }}
        ACCOUNTS: ${{ inputs.accounts_json }}
      run: |
        set -euo pipefail

        if [ -z "$TARGET" ]; then
          echo "Caytu-hosted: acting in our own account."
          {
            echo "assume_role_arn="
            echo "external_id="
            echo "permissions_boundary="
            echo "create_ssh_key_pair=true"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        test -n "$ACCOUNTS" || {
          echo "::error::target account is $TARGET but no customer accounts are configured, so there is no role to assume."
          exit 1
        }

        entry="$(printf '%s' "$ACCOUNTS" | jq -c --arg a "$TARGET" '.[$a] // empty')"
        test -n "$entry" || {
          echo "::error::account $TARGET is not configured. Onboard it first."
          exit 1
        }

        role="$(printf '%s' "$entry" | jq -r '.role_arn // ""')"
        ext="$(printf '%s' "$entry" | jq -r '.external_id // ""')"
        boundary="$(printf '%s' "$entry" | jq -r '.permissions_boundary // ""')"

        # Masked before any later step can echo it.
        [ -n "$ext" ] && echo "::add-mask::$ext"

        test -n "$role" || { echo "::error::account $TARGET has no role_arn recorded."; exit 1; }
        test -n "$boundary" || {
          echo "::error::account $TARGET has no permissions_boundary recorded. An apply there would be refused on CreateRole."
          exit 1
        }

        {
          echo "assume_role_arn=$role"
          echo "external_id=$ext"
          echo "permissions_boundary=$boundary"
          echo "create_ssh_key_pair=false"
        } >> "$GITHUB_OUTPUT"
        echo "Acting in $TARGET via $role"
