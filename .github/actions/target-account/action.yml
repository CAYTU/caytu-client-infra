name: Work out whose account this is
description: >
  Turn the access the platform holds for a deployment into the values Terraform
  and the AWS CLI need. Empty target means our own account, which is every
  Caytu-hosted deployment.

inputs:
  target_account_id:
    description: "AWS account to act in. Empty means our own."
    required: false
    default: ""
  role_arn:
    description: "Role to assume there. Recorded when the deployment was created."
    required: false
    default: ""
  external_id:
    description: >
      Value that account's trust policy demands, masked before anything prints
      it. Empty means the account trusts GitHub directly.
    required: false
    default: ""
  permissions_boundary:
    description: "Boundary that account requires on every role we create."
    required: false
    default: ""

outputs:
  assume_role_arn:
    description: "Empty on the hosted path."
    value: ${{ steps.resolve.outputs.assume_role_arn }}
  external_id:
    value: ${{ steps.resolve.outputs.external_id }}
    description: "Empty on the hosted path."
  permissions_boundary:
    description: "Empty on the hosted path."
    value: ${{ steps.resolve.outputs.permissions_boundary }}
  create_ssh_key_pair:
    description: "False for a customer account, where Session Manager is the way in."
    value: ${{ steps.resolve.outputs.create_ssh_key_pair }}
  web_identity_token_file:
    description: "A token minted for this run, on disk. Empty on the external id path."
    value: ${{ steps.resolve.outputs.web_identity_token_file }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        TARGET: ${{ inputs.target_account_id }}
        ROLE: ${{ inputs.role_arn }}
        EXT: ${{ inputs.external_id }}
        BOUNDARY: ${{ inputs.permissions_boundary }}
      run: |
        set -euo pipefail

        # Masked first, before any check below can echo it into the log.
        [ -n "$EXT" ] && echo "::add-mask::$EXT"

        if [ -z "$TARGET" ]; then
          echo "Caytu-hosted: acting in our own account."
          {
            echo "assume_role_arn="
            echo "external_id="
            echo "permissions_boundary="
            echo "create_ssh_key_pair=true"
            echo "web_identity_token_file="
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # The id is the one value that may be absent: no id means the account
        # trusts GitHub directly, and its absence is the choice.
        for pair in "role_arn:$ROLE" "permissions_boundary:$BOUNDARY"; do
          if [ -z "${pair#*:}" ]; then
            echo "::error::account $TARGET was requested but ${pair%%:*} is empty. Re-check the access recorded on the deployment."
            exit 1
          fi
        done

        # A role in a different account than the one asked for would provision
        # somewhere nobody agreed to.
        case "$ROLE" in
          arn:aws*:iam::"$TARGET":role/*) ;;
          *) echo "::error::the role is not in account $TARGET"; exit 1 ;;
        esac

        # Minted here so all three workflows step in the same way.
        token_file=""
        if [ -z "$EXT" ]; then
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::account $TARGET trusts GitHub directly, but this job cannot mint a token. The workflow needs permissions: id-token: write."
            exit 1
          fi
          token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value // empty')"
          if [ -z "$token" ]; then
            echo "::error::GitHub did not return a token for account $TARGET"
            exit 1
          fi
          echo "::add-mask::$token"
          token_file="$RUNNER_TEMP/web-identity-token"
          printf '%s' "$token" > "$token_file"
          chmod 600 "$token_file"
          echo "Acting in $TARGET with a token minted for this run"
        else
          echo "Acting in $TARGET"
        fi

        {
          echo "assume_role_arn=$ROLE"
          echo "external_id=$EXT"
          echo "permissions_boundary=$BOUNDARY"
          echo "create_ssh_key_pair=false"
          echo "web_identity_token_file=$token_file"
        } >> "$GITHUB_OUTPUT"
