name: Stop or start a Caytu-hosted machine

# Pause a deployment without throwing it away.
#
# Terminating used to leave the EC2 instance running at full price, so the only
# way to stop paying was to destroy everything permanently. That left no middle
# between "keep paying" and "gone for good", which is the wrong shape: most
# reasons to stop a deployment are temporary.
#
# Stopping keeps the disk. Starting brings the same machine back with its data,
# so a paused deployment can be resumed rather than rebuilt. Cost falls to
# storage, a few cents a month instead of a few dollars a day.
#
# The instance id comes from the deployment's own terraform state, never from
# the request. A workflow that stopped whichever instance it was handed would be
# one typo away from stopping a different customer's machine.

run-name: ${{ inputs.action }} ${{ inputs.subdomain }} (${{ inputs.instance_id }})

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "The platform's deployment record id"
        required: true
      action:
        description: "stop or start"
        required: true
        type: choice
        options: [stop, start]
      region:
        description: "AWS region the machine is in"
        required: true
        default: "us-east-1"
      target_account_id:
        description: "AWS account the machine lives in. Empty means our own."
        required: false
        default: ""
      target_role_arn:
        description: "Role to assume in that account. Required when target_account_id is set."
        required: false
        default: ""
      target_external_id:
        description: "External id that account's trust policy demands."
        required: false
        default: ""
      target_permissions_boundary:
        description: "Boundary that account requires on every role we create."
        required: false
        default: ""
      subdomain:
        description: "Hostname label, for the run name only"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  TF_DIR: terraform/aws/single-instance

jobs:
  power:
    name: ${{ github.event.inputs.action }} ${{ github.event.inputs.instance_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PROVISIONING_ROLE_ARN }}
          role-session-name: power-${{ github.event.inputs.instance_id }}
          aws-region: ${{ github.event.inputs.region }}

      - name: Work out whose account this is
        id: target
        uses: ./.github/actions/target-account
        with:
          target_account_id: ${{ github.event.inputs.target_account_id }}
          role_arn: ${{ github.event.inputs.target_role_arn }}
          external_id: ${{ github.event.inputs.target_external_id }}
          permissions_boundary: ${{ github.event.inputs.target_permissions_boundary }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Find the machine from this deployment's state
        id: find
        working-directory: ${{ env.TF_DIR }}
        env:
          REGION: ${{ github.event.inputs.region }}
          INSTANCE_ID: ${{ github.event.inputs.instance_id }}
        run: |
          set -euo pipefail
          test -n "$TF_STATE_BUCKET" || {
            echo "::error::TF_STATE_BUCKET is not set, so there is no state to read the machine from."
            exit 1
          }
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=instances/${INSTANCE_ID}/terraform.tfstate" \
            -backend-config="region=${REGION}" \
            ${TF_STATE_TABLE:+-backend-config="dynamodb_table=${TF_STATE_TABLE}"} \
            -backend-config="encrypt=true"

          ec2="$(terraform output -raw instance_id 2>/dev/null || true)"
          if [ -z "$ec2" ]; then
            echo "::error::No machine in this deployment's state. It was never provisioned, or it has already been destroyed."
            exit 1
          fi
          echo "ec2=$ec2" >> "$GITHUB_OUTPUT"
          echo "machine: $ec2"

      # After the state read, not before it. The state bucket is ours and the
      # machine may not be, so hopping too early loses access to the state.
      - name: Step into the customer account
        if: steps.target.outputs.assume_role_arn != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.target.outputs.assume_role_arn }}
          role-external-id: ${{ steps.target.outputs.external_id }}
          role-session-name: power-${{ github.event.inputs.instance_id }}
          role-chaining: true
          aws-region: ${{ github.event.inputs.region }}

      - name: ${{ github.event.inputs.action }}
        env:
          EC2: ${{ steps.find.outputs.ec2 }}
          ACTION: ${{ github.event.inputs.action }}
          REGION: ${{ github.event.inputs.region }}
        run: |
          set -euo pipefail
          # Both are idempotent in AWS: stopping a stopped instance and starting
          # a running one are accepted, so a repeated request is harmless.
          if [ "$ACTION" = "stop" ]; then
            aws ec2 stop-instances --region "$REGION" --instance-ids "$EC2" >/dev/null
            aws ec2 wait instance-stopped --region "$REGION" --instance-ids "$EC2"
          else
            aws ec2 start-instances --region "$REGION" --instance-ids "$EC2" >/dev/null
            aws ec2 wait instance-running --region "$REGION" --instance-ids "$EC2"
          fi

          state="$(aws ec2 describe-instances --region "$REGION" --instance-ids "$EC2" \
                    --query 'Reservations[].Instances[].State.Name' --output text)"
          echo "::notice::$EC2 is now $state"
          echo "$EC2 is now $state" >> "$GITHUB_STEP_SUMMARY"

          # Waited for, not assumed. A stop that is still pending is a machine
          # still being charged, and reporting success there would be a bill
          # nobody expected.
          case "$ACTION:$state" in
            stop:stopped|start:running) ;;
            *) echo "::error::expected $ACTION to finish, but the machine is $state"; exit 1 ;;
          esac
