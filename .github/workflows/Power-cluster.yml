name: Stop or start a Caytu-hosted machine

# Pause a deployment without throwing it away.
#
# Terminating used to leave the EC2 instance running at full price, so the only
# way to stop paying was to destroy everything permanently. That left no middle
# between "keep paying" and "gone for good", which is the wrong shape: most
# reasons to stop a deployment are temporary.
#
# Stopping keeps the disk. Starting brings the same machine back with its data,
# so a paused deployment can be resumed rather than rebuilt. Cost falls to
# storage, a few cents a month instead of a few dollars a day.
#
# The instance id comes from the deployment's own terraform state, never from
# the request. A workflow that stopped whichever instance it was handed would be
# one typo away from stopping a different customer's machine.

run-name: ${{ inputs.action }} cluster ${{ inputs.subdomain }} (${{ inputs.instance_id }})

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "The platform's deployment record id"
        required: true
      action:
        description: "stop or start"
        required: true
        type: choice
        options: [stop, start]
      region:
        description: "AWS region the machine is in"
        required: true
        default: "us-east-1"
      target_account_id:
        description: "AWS account the machine lives in. Empty means our own."
        required: false
        default: ""
      target_role_arn:
        description: "Role to assume in that account. Required when target_account_id is set."
        required: false
        default: ""
      target_external_id:
        description: "External id that account's trust policy demands."
        required: false
        default: ""
      target_permissions_boundary:
        description: "Boundary that account requires on every role we create."
        required: false
        default: ""
      subdomain:
        description: "Hostname label, for the run name only"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  TF_DIR: terraform/aws/managed-cluster

jobs:
  power:
    name: ${{ github.event.inputs.action }} ${{ github.event.inputs.instance_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PROVISIONING_ROLE_ARN }}
          role-session-name: power-cluster-${{ github.event.inputs.instance_id }}
          aws-region: ${{ github.event.inputs.region }}

      - name: Work out whose account this is
        id: target
        uses: ./.github/actions/target-account
        with:
          target_account_id: ${{ github.event.inputs.target_account_id }}
          role_arn: ${{ github.event.inputs.target_role_arn }}
          external_id: ${{ github.event.inputs.target_external_id }}
          permissions_boundary: ${{ github.event.inputs.target_permissions_boundary }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Find the machine from this deployment's state
        id: find
        working-directory: ${{ env.TF_DIR }}
        env:
          REGION: ${{ github.event.inputs.region }}
          INSTANCE_ID: ${{ github.event.inputs.instance_id }}
        run: |
          set -euo pipefail
          test -n "$TF_STATE_BUCKET" || {
            echo "::error::TF_STATE_BUCKET is not set, so there is no state to read the machine from."
            exit 1
          }
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=instances/${INSTANCE_ID}/cluster.tfstate" \
            -backend-config="region=${REGION}" \
            ${TF_STATE_TABLE:+-backend-config="dynamodb_table=${TF_STATE_TABLE}"} \
            -backend-config="encrypt=true"

          name="$(terraform output -raw cluster_name 2>/dev/null || true)"
          if [ -z "$name" ]; then
            echo "::error::No cluster in this deployment's state. It was never provisioned, or it has already been destroyed."
            exit 1
          fi
          echo "cluster=$name" >> "$GITHUB_OUTPUT"
          echo "cluster: $name"

      # After the state read, not before it. The state bucket is ours and the
      # machine may not be, so hopping too early loses access to the state.
      - name: Step into the customer account
        if: steps.target.outputs.assume_role_arn != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.target.outputs.assume_role_arn }}
          role-external-id: ${{ steps.target.outputs.external_id }}
          role-session-name: power-cluster-${{ github.event.inputs.instance_id }}
          role-chaining: true
          # No session tags. They buy nothing on an assume we control both ends
          # of, and asking for them means sts:TagSession has to be granted on
          # our side and on every customer's trust policy forever. A stack whose
          # trust predates that requirement cannot be stopped at all, which is
          # exactly what happened.
          role-skip-session-tagging: true
          aws-region: ${{ github.event.inputs.region }}

      - name: ${{ github.event.inputs.action }}
        env:
          CLUSTER: ${{ steps.find.outputs.cluster }}
          ACTION: ${{ github.event.inputs.action }}
          REGION: ${{ github.event.inputs.region }}
        run: |
          set -euo pipefail

          # Stopping a cluster means taking its nodes away. There is no pause
          # for the control plane: EKS charges for it whether or not anything
          # runs on it, so a stopped cluster still costs that and the console
          # should not pretend otherwise.
          #
          # The node groups keep their configuration, so starting is putting the
          # counts back rather than building anything.
          groups="$(aws eks list-nodegroups --region "$REGION" \
            --cluster-name "$CLUSTER" --query 'nodegroups' --output text)"
          [ -n "$groups" ] || { echo "::error::That cluster has no node groups."; exit 1; }

          for g in $groups; do
            if [ "$ACTION" = "stop" ]; then
              # Saved first, or starting again would have nothing to restore to
              # and would have to guess.
              current="$(aws eks describe-nodegroup --region "$REGION" \
                --cluster-name "$CLUSTER" --nodegroup-name "$g" \
                --query 'nodegroup.scalingConfig.[minSize,desiredSize,maxSize]' --output text)"
              read -r min desired max <<< "$current"
              aws eks tag-resource --region "$REGION" \
                --resource-arn "$(aws eks describe-nodegroup --region "$REGION" \
                  --cluster-name "$CLUSTER" --nodegroup-name "$g" \
                  --query 'nodegroup.nodegroupArn' --output text)" \
                --tags "caytu.io/stopped-from=${min}-${desired}-${max}" >/dev/null

              aws eks update-nodegroup-config --region "$REGION" \
                --cluster-name "$CLUSTER" --nodegroup-name "$g" \
                --scaling-config minSize=0,maxSize=1,desiredSize=0 >/dev/null
              echo "$g scaled to zero"
            else
              saved="$(aws eks describe-nodegroup --region "$REGION" \
                --cluster-name "$CLUSTER" --nodegroup-name "$g" \
                --query 'nodegroup.tags."caytu.io/stopped-from"' --output text 2>/dev/null || true)"
              if [ -n "$saved" ] && [ "$saved" != "None" ]; then
                IFS='-' read -r min desired max <<< "$saved"
              else
                # Nothing recorded, so this was never stopped by us. Two nodes
                # is the floor the console offers, and it is better than
                # refusing to start a cluster somebody is waiting on.
                min=2; desired=2; max=10
                echo "::warning::no saved size for $g, starting at $min"
              fi
              aws eks update-nodegroup-config --region "$REGION" \
                --cluster-name "$CLUSTER" --nodegroup-name "$g" \
                --scaling-config "minSize=${min},maxSize=${max},desiredSize=${desired}" >/dev/null
              echo "$g back to $desired"
            fi
          done

          if [ "$ACTION" = "stop" ]; then
            echo "::notice::$CLUSTER has no nodes running. Its control plane still costs about \$73 a month."
            echo "$CLUSTER stopped. The control plane still costs about \$73 a month." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::$CLUSTER is starting its nodes back up."
            echo "$CLUSTER is starting its nodes back up." >> "$GITHUB_STEP_SUMMARY"
          fi
