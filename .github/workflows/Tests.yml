# Runs the shell test suites.
#
# They existed before this and nothing ran them, so they protected nothing:
# every check only fired if someone remembered to type the command.
name: Tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "compose/nginx/**"
      - "tests/**"
      - "cloudformation/**"
      - ".github/workflows/Tests.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "compose/nginx/**"
      - "tests/**"
      - "cloudformation/**"
      - ".github/workflows/Tests.yml"

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          set -euo pipefail
          for f in scripts/caytu-client scripts/bootstrap.sh scripts/lib/*.sh; do
            bash -n "$f"
          done

      # The template is JSON inside YAML, so a broken policy parses here and
      # fails only when a customer creates the stack.
      - name: The access template
        run: python3 scripts/verify-cloudformation.py cloudformation/caytu-provisioner-access.yaml

      - name: Suites
        run: |
          set -euo pipefail
          for t in tests/*.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done
