name: Provision a cluster deployment

# Build one deployment on EKS, and nothing else.
#
# A sibling of Provision.yml rather than a branch inside it. A single machine
# and a cluster share the account resolution and the artifact grant, and agree
# on almost nothing after that: one takes an instance type and an SSH decision,
# the other takes node pools; one ends with a machine that enrols itself, the
# other ends with manifests applied to an API server.
#
# State is per deployment and separate from the single-instance key, so a
# deployment can never have both and destroy the wrong one.
#
# A cluster has no host agent, so unlike a single machine nothing on it can
# enrol and report. This run says what it is doing instead, with a token the
# platform minted for this one deployment. It covers the build and stops there:
# once this finishes, a cluster is silent until the in-cluster agent exists.

run-name: Provision cluster ${{ inputs.subdomain }} (${{ inputs.instance_id }})

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "The platform's deployment record id"
        required: true
      region:
        description: "AWS region"
        required: true
        default: "us-east-1"
      subdomain:
        description: "Hostname label, used to name the resources"
        required: true
      platform_url:
        description: "Where the deployment reports back to"
        required: true
      certificate_arn:
        description: "An existing ACM certificate. Leave empty and the stack requests one."
        required: false
        default: ""
      node_instance_type:
        description: "Instance type for the nodes. Empty uses the stack default."
        required: false
        default: ""
      min_nodes:
        description: "Fewest nodes in the pool that scales. Empty uses the stack default."
        required: false
        default: ""
      max_nodes:
        description: "Most nodes in the pool that scales. Empty uses the stack default."
        required: false
        default: ""
      report_token:
        description: "Lets this run report progress for one deployment. Minted by the platform."
        required: false
        default: ""
      target_account_id:
        description: "AWS account to build in. Empty means our own."
        required: false
        default: ""
      target_role_arn:
        required: false
        default: ""
      target_external_id:
        required: false
        default: ""
      target_permissions_boundary:
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  # One build per deployment. Two applies against one state corrupts it.
  group: provision-cluster-${{ github.event.inputs.instance_id }}
  cancel-in-progress: false

env:
  TF_DIR: terraform/aws/managed-cluster
  OVERLAY: kubernetes/overlays/aws-eks
  # Where the images actually are. Same pair bootstrap.sh and the agent use.
  CAYTU_IMAGE_ACCOUNT: "688544396352"
  CAYTU_IMAGE_REGION: us-east-1

jobs:
  provision:
    name: Provision cluster ${{ github.event.inputs.subdomain }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
    steps:
      - uses: actions/checkout@v4

      # Progress the console can read while this runs. Never fatal: a build that
      # cannot report is still a build, and failing here would destroy a working
      # cluster over a status line.
      - name: Set up reporting
        env:
          PLATFORM_URL: ${{ github.event.inputs.platform_url }}
          INSTANCE_ID: ${{ github.event.inputs.instance_id }}
          REPORT_TOKEN: ${{ github.event.inputs.report_token }}
        run: |
          set -euo pipefail
          cat > /tmp/report.sh <<'SH'
          #!/usr/bin/env bash
          # report <percent> <message> [ok] | report done | report failed <message>
          [ -n "${REPORT_TOKEN:-}" ] || exit 0
          url="${PLATFORM_URL}/api/billings/instances/${INSTANCE_ID}/provision-state"
          case "$1" in
            done)   body='{"status":"running"}' ;;
            failed) body="$(jq -n --arg m "$2" '{status:"failed", lastError:$m,
                              step:{message:$m, ok:false}}')" ;;
            *)      body="$(jq -n --argjson p "$1" --arg m "$2" \
                              '{percent:$p, step:{message:$m, ok:true}}')" ;;
          esac
          curl -fsS -X PATCH "$url" \
            -H "Authorization: Bearer ${REPORT_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$body" >/dev/null 2>&1 || echo "::warning::could not report progress"
          SH
          chmod +x /tmp/report.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PROVISIONING_ROLE_ARN }}
          role-session-name: provision-cluster-${{ github.event.inputs.subdomain }}
          aws-region: ${{ github.event.inputs.region }}

      - name: Work out whose account this is
        id: target
        uses: ./.github/actions/target-account
        with:
          target_account_id: ${{ github.event.inputs.target_account_id }}
          role_arn: ${{ github.event.inputs.target_role_arn }}
          external_id: ${{ github.event.inputs.target_external_id }}
          permissions_boundary: ${{ github.event.inputs.target_permissions_boundary }}

      # Our account, not theirs, so it runs before terraform assumes anything.
      - name: Let that account reach our images
        if: github.event.inputs.target_account_id != ''
        run: ./scripts/grant-customer-artifacts.sh "${{ github.event.inputs.target_account_id }}"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # kubectl and helm are on the runner image; kustomize is not.
      - name: Install kustomize
        run: |
          set -euo pipefail
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Init, with this deployment's own state
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          test -n "$TF_STATE_BUCKET" || {
            echo "::error::TF_STATE_BUCKET is not set. Building without remote state would create a cluster nothing can find again."
            exit 1
          }
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=instances/${{ github.event.inputs.instance_id }}/cluster.tfstate" \
            -backend-config="region=${{ github.event.inputs.region }}" \
            ${TF_STATE_TABLE:+-backend-config="dynamodb_table=${TF_STATE_TABLE}"} \
            -backend-config="encrypt=true"

      - name: Plan
        working-directory: ${{ env.TF_DIR }}
        env:
          REGION: ${{ github.event.inputs.region }}
          SUBDOMAIN: ${{ github.event.inputs.subdomain }}
          ASSUME_ROLE_ARN: ${{ steps.target.outputs.assume_role_arn }}
          ASSUME_EXTERNAL_ID: ${{ steps.target.outputs.external_id }}
          CERT_ARN: ${{ github.event.inputs.certificate_arn }}
          NODE_TYPE: ${{ github.event.inputs.node_instance_type }}
          MIN_NODES: ${{ github.event.inputs.min_nodes }}
          MAX_NODES: ${{ github.event.inputs.max_nodes }}
        run: |
          set -euo pipefail

          # The chosen size applies to both pools; the counts apply only to the
          # one that scales. The stateful pool holds the data pods, which grow
          # vertically rather than horizontally, so letting an operator set its
          # count would offer a lever that does not do what it reads like.
          extra=()
          if [ -n "${NODE_TYPE}" ]; then
            extra+=(-var "stateless_instance_types=[\"${NODE_TYPE}\"]")
            extra+=(-var "stateful_instance_types=[\"${NODE_TYPE}\"]")
          fi
          if [ -n "${MIN_NODES}" ]; then
            extra+=(-var "stateless_min_size=${MIN_NODES}")
            extra+=(-var "stateless_desired_size=${MIN_NODES}")
          fi
          if [ -n "${MAX_NODES}" ]; then
            extra+=(-var "stateless_max_size=${MAX_NODES}")
          fi
          # The zone stays ours whoever owns the cluster, so the dns provider
          # keeps this runner's own credentials rather than assuming anything.
          terraform plan -input=false -out=tfplan \
            -var "aws_profile=" \
            -var "region=${REGION}" \
            -var "environment=production" \
            -var "name_prefix=caytu-${SUBDOMAIN}" \
            -var "assume_role_arn=${ASSUME_ROLE_ARN}" \
            -var "assume_role_external_id=${ASSUME_EXTERNAL_ID}" \
            -var "domain_name=${SUBDOMAIN}.caytu.link" \
            -var "route53_zone_name=caytu.link" \
            -var "certificate_arn=${CERT_ARN}" \
            "${extra[@]+"${extra[@]}"}"

      - name: Report building the cluster and its network
        env:
          PLATFORM_URL: ${{ github.event.inputs.platform_url }}
          INSTANCE_ID: ${{ github.event.inputs.instance_id }}
          REPORT_TOKEN: ${{ github.event.inputs.report_token }}
        run: /tmp/report.sh 20 "building the cluster and its network"

      - name: Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      # Everything below runs against the cluster that now exists.
      - name: Reach the cluster
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          eval "$(terraform output -raw kubeconfig_command)"
          kubectl get nodes

      - name: Report installing the ingress, metrics and autoscaler
        env:
          PLATFORM_URL: ${{ github.event.inputs.platform_url }}
          INSTANCE_ID: ${{ github.event.inputs.instance_id }}
          REPORT_TOKEN: ${{ github.event.inputs.report_token }}
        run: /tmp/report.sh 55 "installing the ingress, metrics and autoscaler"

      - name: Cluster add-ons
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          # The manifests below assume an ingress class and a metrics source.
          # Applying them first would leave the ingress unclaimed and the HPAs
          # unable to read anything.
          terraform output -raw helm_commands > /tmp/addons.sh
          bash /tmp/addons.sh

      - name: Configure the deployment
        working-directory: ${{ env.TF_DIR }}
        env:
          SUBDOMAIN: ${{ github.event.inputs.subdomain }}
          PLATFORM_URL: ${{ github.event.inputs.platform_url }}
        run: |
          set -euo pipefail
          # Ours, never the cluster's. terraform output ecr_registry reports
          # whichever account this applied into, and a customer's registry is
          # empty, so every pod would sit in ImagePullBackOff.
          registry="${CAYTU_IMAGE_ACCOUNT}.dkr.ecr.${CAYTU_IMAGE_REGION}.amazonaws.com"
          # Whichever it is: the one that was passed in, or the one just created.
          CERT_ARN="$(terraform output -raw certificate_arn)"
          test -n "$CERT_ARN" || {
            echo "::error::No certificate. The ingress would serve nothing."
            exit 1
          }
          overlay="${GITHUB_WORKSPACE}/${OVERLAY}"

          # Generated here for now. The platform will own these once deployment
          # settings exist; until then a cluster gets working values rather than
          # the placeholders in the example file.
          {
            echo "CAYTU_DOMAIN=${SUBDOMAIN}.caytu.link"
            echo "CAYTU_BILLINGS_URL=${PLATFORM_URL}"
            echo "MINIO_ROOT_USER=caytu"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "TURN_SECRET=$(openssl rand -hex 32)"
            echo "SIGNALING_AUTH_TOKEN=$(openssl rand -hex 32)"
            echo "JWT_SECRET=$(openssl rand -hex 64)"
          } > "$overlay/secrets.env"

          cd "$overlay"
          kustomize edit set image \
            "caytu-client/backend=${registry}/caytu-client-backend:latest" \
            "caytu-client/frontend=${registry}/caytu-client-frontend:latest" \
            "caytu-client/gstreamer-recorder=${registry}/caytu-client-gstreamer-recorder:latest" \
            "caytu-client/mqtt-streamer=${registry}/caytu-client-mqtt-streamer:latest"

          # The example carries a placeholder host and certificate.
          sed -i "s|caytu.example.com|${SUBDOMAIN}.caytu.link|g" kustomization.yaml
          sed -i "s|arn:aws:acm:REGION:ACCOUNT:certificate/UUID|${CERT_ARN}|g" kustomization.yaml

      - name: Report starting the application
        env:
          PLATFORM_URL: ${{ github.event.inputs.platform_url }}
          INSTANCE_ID: ${{ github.event.inputs.instance_id }}
          REPORT_TOKEN: ${{ github.event.inputs.report_token }}
        run: /tmp/report.sh 75 "starting the application"

      - name: Apply the manifests
        run: |
          set -euo pipefail
          kubectl apply -k "${GITHUB_WORKSPACE}/${OVERLAY}"
          kubectl -n caytu-client rollout status deploy/backend --timeout=10m

      # Not in Terraform: this balancer is created by the ingress controller
      # during the apply above, so its name does not exist at plan time.
      # Written with the runner's own credentials, because the zone is ours
      # whoever owns the cluster.
      - name: Report pointing the address at the load balancer
        env:
          PLATFORM_URL: ${{ github.event.inputs.platform_url }}
          INSTANCE_ID: ${{ github.event.inputs.instance_id }}
          REPORT_TOKEN: ${{ github.event.inputs.report_token }}
        run: /tmp/report.sh 90 "pointing the address at the load balancer"

      - name: Point the name at the load balancer
        env:
          SUBDOMAIN: ${{ github.event.inputs.subdomain }}
        run: |
          set -euo pipefail
          host=""
          for _ in $(seq 1 60); do
            host="$(kubectl -n caytu-client get ingress -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            [ -n "$host" ] && break
            sleep 10
          done
          test -n "$host" || {
            echo "::error::The ingress never reported a load balancer, so ${SUBDOMAIN}.caytu.link has nothing to point at."
            exit 1
          }

          zone="$(aws route53 list-hosted-zones-by-name --dns-name caytu.link. \
            --query 'HostedZones[0].Id' --output text | cut -d/ -f3)"

          # CNAME rather than an alias record: an alias needs the balancer's
          # zone id, which belongs to whichever account holds the cluster.
          aws route53 change-resource-record-sets --hosted-zone-id "$zone" \
            --change-batch "$(jq -n --arg n "${SUBDOMAIN}.caytu.link" --arg v "$host" '
              {Changes:[{Action:"UPSERT",ResourceRecordSet:{
                Name:$n, Type:"CNAME", TTL:60, ResourceRecords:[{Value:$v}]}}]}')"

          echo "${SUBDOMAIN}.caytu.link -> $host"

      - name: Report the outcome
        if: always()
        env:
          PLATFORM_URL: ${{ github.event.inputs.platform_url }}
          INSTANCE_ID: ${{ github.event.inputs.instance_id }}
          REPORT_TOKEN: ${{ github.event.inputs.report_token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            /tmp/report.sh done
          else
            /tmp/report.sh failed "the build failed at ${{ job.status }}, see the run log"
          fi

      - name: What was created
        if: always()
        run: |
          {
            echo "### Cluster \`${{ github.event.inputs.subdomain }}\`"
            echo
            kubectl -n caytu-client get pods 2>/dev/null || echo "the cluster was not reachable"
            echo
            echo "No agent runs in a cluster yet, so the console will still show this as provisioning."
          } >> "$GITHUB_STEP_SUMMARY"
