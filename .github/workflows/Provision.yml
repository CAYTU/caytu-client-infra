name: Provision a Caytu-hosted deployment

# Create the machine for one deployment, and nothing else.
#
# The platform dispatches this rather than running Terraform itself, so no AWS
# credential ever has to live in a platform service. They stay here, where the
# other pipeline credentials already are, and every provision leaves a log and an
# audit trail without anyone building one.
#
# State is per deployment. The whole point is worth repeating because getting it
# wrong is silent and destructive: every deployment uses the same Terraform
# configuration, so one shared state file would make provisioning the second
# customer see the first customer's instance as "the" instance and destroy it.
# The key below is what keeps them apart.
#
# Nothing here is customer-supplied. The values come from the deployment record
# the platform already wrote, so a customer cannot ask for a bigger machine by
# editing a request.

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "The platform's deployment record id"
        required: true
      region:
        description: "AWS region, e.g. us-east-1"
        required: true
        default: "us-east-1"
      subdomain:
        description: "Hostname label, used to name the resources"
        required: true
      platform_url:
        description: "Where the deployment reports back to"
        required: true
      instance_arch:
        description: "arm64 (Graviton, cheaper) or amd64"
        required: false
        default: "arm64"
      instance_type:
        description: "Left empty to use the default for the architecture"
        required: false
        default: ""
      root_volume_size_gb:
        description: "Disk in GB. Left empty to use the stack default."
        required: false
        default: ""
      target_account_id:
        description: "AWS account to provision into. Empty means our own, which is the Caytu-hosted case."
        required: false
        default: ""
      target_role_arn:
        description: "Role to assume in that account. Required when target_account_id is set."
        required: false
        default: ""
      target_external_id:
        description: "External id that account's trust policy demands."
        required: false
        default: ""
      target_permissions_boundary:
        description: "Boundary that account requires on every role we create."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  TF_DIR: terraform/aws/single-instance

jobs:
  provision:
    name: Provision ${{ github.event.inputs.subdomain }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Here rather than at workflow level: `env` up there can only read the
    # github, vars and inputs contexts, so naming `secrets` made the whole file
    # invalid and GitHub refused it before creating a single job. A job's env
    # can read secrets.
    env:
      # Must already exist. Terraform cannot create the bucket holding its own state.
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
    steps:
      - uses: actions/checkout@v4

      # OIDC, not a stored key. The token is minted for this run and expires
      # with it, so there is no credential left to leak between provisions.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PROVISIONING_ROLE_ARN }}
          role-session-name: provision-${{ github.event.inputs.subdomain }}
          aws-region: ${{ github.event.inputs.region }}

      # Terraform steps into the customer account itself, through the provider.
      - name: Work out whose account this is
        id: target
        uses: ./.github/actions/target-account
        with:
          target_account_id: ${{ github.event.inputs.target_account_id }}
          role_arn: ${{ github.event.inputs.target_role_arn }}
          external_id: ${{ github.event.inputs.target_external_id }}
          permissions_boundary: ${{ github.event.inputs.target_permissions_boundary }}

      # Before terraform, and with our own credentials rather than theirs: this
      # grants in our account, not in the customer's. Onboarding used to be two
      # terraform applies run by hand, which does not survive a second customer.
      - name: Let that account reach our images and the agent
        if: github.event.inputs.target_account_id != ''
        run: ./scripts/grant-customer-artifacts.sh "${{ github.event.inputs.target_account_id }}"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Init, with this deployment's own state
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          test -n "$TF_STATE_BUCKET" || {
            echo "::error::TF_STATE_BUCKET is not set. Provisioning without remote state would create a machine nothing can ever find again."
            exit 1
          }
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=instances/${{ github.event.inputs.instance_id }}/terraform.tfstate" \
            -backend-config="region=${{ github.event.inputs.region }}" \
            ${TF_STATE_TABLE:+-backend-config="dynamodb_table=${TF_STATE_TABLE}"} \
            -backend-config="encrypt=true"

      - name: Plan
        working-directory: ${{ env.TF_DIR }}
        # Through the environment, not interpolated into the script: a value that
        # lands inside the shell text is a value that can end the command and
        # start another one.
        env:
          REGION: ${{ github.event.inputs.region }}
          SUBDOMAIN: ${{ github.event.inputs.subdomain }}
          # The zone every hosted deployment gets a name in.
          DNS_ZONE: caytu.link
          INSTANCE_ARCH: ${{ github.event.inputs.instance_arch }}
          INSTANCE_TYPE: ${{ github.event.inputs.instance_type }}
          ROOT_VOLUME_SIZE_GB: ${{ github.event.inputs.root_volume_size_gb }}
          INSTANCE_ID: ${{ github.event.inputs.instance_id }}
          PLATFORM_URL: ${{ github.event.inputs.platform_url }}
          ASSUME_ROLE_ARN: ${{ steps.target.outputs.assume_role_arn }}
          ASSUME_EXTERNAL_ID: ${{ steps.target.outputs.external_id }}
          PERMISSIONS_BOUNDARY: ${{ steps.target.outputs.permissions_boundary }}
          CREATE_SSH_KEY_PAIR: ${{ steps.target.outputs.create_ssh_key_pair }}
        run: |
          set -euo pipefail
          # aws_profile empty on purpose: a runner has environment credentials
          # and no ~/.aws/credentials for a named profile to live in.
          # The optional -var is built in shell rather than with a GitHub
          # expression: one that renders to nothing inside a line continuation
          # works until it does not, and this plan creates real infrastructure.
          #
          # Note the shape of that sentence. GitHub expands its expression
          # syntax anywhere in a run block, comments included, so writing the
          # empty form here to illustrate it is what made this whole file
          # unloadable: every push reported a startup failure and no job.
          # The architecture has to match the type, and only one of them can be
          # authoritative. The console picks a type from its own list and knows
          # nothing about this input, so a type chosen there arrived next to an
          # arch left on its default and RunInstances refused the pair.
          #
          # AWS names Graviton families with a trailing g on the family: t4g,
          # m6g, c7g. Everything else is x86.
          arch="${INSTANCE_ARCH}"
          if [ -n "${INSTANCE_TYPE}" ]; then
            # The g comes straight after the generation number and may carry
            # more letters: t4g, m6gd, c6gn, x2gd. Matching a trailing g alone
            # gets c6gn wrong and builds a machine that cannot boot.
            if [[ "${INSTANCE_TYPE%%.*}" =~ [0-9]g[a-z]*$ ]]; then
              arch="arm64"
            else
              arch="amd64"
            fi
            echo "instance type ${INSTANCE_TYPE} is ${arch}"
          fi

          extra=()
          if [ -n "${INSTANCE_TYPE}" ]; then
            extra+=(-var "instance_type=${INSTANCE_TYPE}")
          fi
          if [ -n "${ROOT_VOLUME_SIZE_GB}" ]; then
            extra+=(-var "root_volume_size_gb=${ROOT_VOLUME_SIZE_GB}")
          fi

          # Empty on the hosted path, which leaves the provider using this
          # run's own credentials exactly as before.
          terraform plan -input=false -out=tfplan \
            -var "aws_profile=" \
            -var "assume_role_arn=${ASSUME_ROLE_ARN}" \
            -var "assume_role_external_id=${ASSUME_EXTERNAL_ID}" \
            -var "iam_permissions_boundary=${PERMISSIONS_BOUNDARY}" \
            -var "create_ssh_key_pair=${CREATE_SSH_KEY_PAIR}" \
            -var "region=${REGION}" \
            -var "environment=production" \
            -var "name_prefix=caytu-${SUBDOMAIN}" \
            -var "instance_arch=${arch}" \
            "${extra[@]}" \
            -var "caytu_instance_id=${INSTANCE_ID}" \
            -var "caytu_platform_url=${PLATFORM_URL}" \
            -var "enable_route53=true" \
              -var "route53_zone_name=${DNS_ZONE}" \
              -var "domain_name=${SUBDOMAIN}.${DNS_ZONE}" \
              -var 'operator_ssh_cidrs=[]'

      - name: Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: What was created
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "### Provisioned \`${{ github.event.inputs.subdomain }}\`"
            echo
            echo "The machine enrols itself and claims deployment \`${{ github.event.inputs.instance_id }}\`."
            echo "Nothing else is needed: watch the deployment's state in the console."
          } >> "$GITHUB_STEP_SUMMARY"
