name: Destroy a cluster deployment

# Remove the cluster for one deployment, and nothing else.
#
# The mirror of Provision-cluster.yml, and it matters that it is a mirror: it
# reads that workflow's state key, not the single-instance one. A deployment
# never has both, so pointing this at the wrong key would report success while
# the cluster kept running and kept billing.
#
# A cluster costs far more than a machine to leave up, which is why this exists
# before the first one is built rather than after.
#
# Nothing here is customer-supplied. The values come from the deployment record.

run-name: Destroy cluster ${{ inputs.subdomain }} (${{ inputs.instance_id }})

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "The platform's deployment record id"
        required: true
      region:
        description: "AWS region the cluster was built in"
        required: true
        default: "us-east-1"
      target_account_id:
        description: "AWS account the cluster lives in. Empty means our own."
        required: false
        default: ""
      target_role_arn:
        description: "Role to assume in that account. Required when target_account_id is set."
        required: false
        default: ""
      target_external_id:
        description: "External id that account's trust policy demands."
        required: false
        default: ""
      target_permissions_boundary:
        description: "Boundary that account requires on every role we create."
        required: false
        default: ""
      subdomain:
        description: "Hostname label, for the run name only"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  TF_DIR: terraform/aws/managed-cluster

jobs:
  destroy:
    name: Destroy cluster ${{ github.event.inputs.instance_id }}
    runs-on: ubuntu-latest
    # A cluster takes longer to remove than a machine: node groups drain first,
    # then the control plane, then the network behind it.
    timeout-minutes: 60
    env:
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PROVISIONING_ROLE_ARN }}
          role-session-name: destroy-cluster-${{ github.event.inputs.instance_id }}
          aws-region: ${{ github.event.inputs.region }}

      # The state lives in our bucket, the cluster may not. Getting this wrong
      # is a destroy that reports success against an empty account while the
      # customer's cluster keeps running.
      - name: Work out whose account this is
        id: target
        uses: ./.github/actions/target-account
        with:
          target_account_id: ${{ github.event.inputs.target_account_id }}
          role_arn: ${{ github.event.inputs.target_role_arn }}
          external_id: ${{ github.event.inputs.target_external_id }}
          permissions_boundary: ${{ github.event.inputs.target_permissions_boundary }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Init, against this deployment's own state
        working-directory: ${{ env.TF_DIR }}
        env:
          REGION: ${{ github.event.inputs.region }}
          INSTANCE_ID: ${{ github.event.inputs.instance_id }}
        run: |
          set -euo pipefail
          test -n "$TF_STATE_BUCKET" || {
            echo "::error::TF_STATE_BUCKET is not set. Without the state there is nothing to destroy from, and the cluster would be left running."
            exit 1
          }
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=instances/${INSTANCE_ID}/cluster.tfstate" \
            -backend-config="region=${REGION}" \
            ${TF_STATE_TABLE:+-backend-config="dynamodb_table=${TF_STATE_TABLE}"} \
            -backend-config="encrypt=true"

      - name: What exists right now
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          # Printed before anything is removed, so the run log records what was
          # there. If this is empty the state is already clean and the destroy
          # below is a no-op, which is the expected outcome of running twice.
          terraform state list || true

      # Objects inside the cluster, which die with it.
      #
      # Terraform tries to delete them through the Kubernetes API, and by then
      # the cluster is going away, so the provider has no endpoint and falls
      # back to localhost. The destroy then stops on a connection refused with
      # every real resource still standing, which is how a teardown leaves a
      # NAT gateway running.
      #
      # Dropped from state rather than deleted: there is nothing to delete once
      # the control plane is gone, and nothing outside the cluster refers to
      # them.
      - name: Forget the objects that live inside the cluster
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          terraform state list 2>/dev/null | grep -E '^kubernetes_' | while read -r addr; do
            echo "forgetting $addr"
            terraform state rm "$addr" >/dev/null
          done || true

      # Terraform assumes the customer's role for itself. The shell does not, so
      # the interface cleanup below would look in our own account and find
      # nothing to do, which is worse than failing.
      - name: Step into the account the cluster is in
        if: steps.target.outputs.assume_role_arn != ''
        env:
          ROLE: ${{ steps.target.outputs.assume_role_arn }}
          EXTERNAL_ID: ${{ steps.target.outputs.external_id }}
        run: |
          set -euo pipefail
          creds="$(aws sts assume-role \
            --role-arn "$ROLE" \
            --role-session-name "cluster-teardown-${{ github.event.inputs.instance_id }}" \
            --external-id "$EXTERNAL_ID" \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)"

          read -r key secret token <<< "$creds"
          echo "::add-mask::$secret"
          echo "::add-mask::$token"

          # A file, not the environment: Terraform does its own assuming, and
          # exporting these would change what it runs as halfway through.
          umask 077
          {
            echo "export AWS_ACCESS_KEY_ID=$key"
            echo "export AWS_SECRET_ACCESS_KEY=$secret"
            echo "export AWS_SESSION_TOKEN=$token"
          } > "$RUNNER_TEMP/cluster-creds.sh"

      # Network interfaces the cluster left behind.
      #
      # EKS puts interfaces in the private subnets for its control plane, and
      # the load balancer controller makes more. They are not Terraform's, so a
      # destroy removes everything else and then cannot delete the subnet or the
      # security group holding them, and stops with a DependencyViolation that
      # names an id and nothing else.
      #
      # Only detached ones. An interface still in use belongs to something that
      # has not gone yet, and deleting it would break that rather than help.
      - name: Remove interfaces the cluster left behind
        id: sweep
        if: always()
        working-directory: ${{ env.TF_DIR }}
        env:
          REGION: ${{ github.event.inputs.region }}
        run: |
          set -uo pipefail
          # The state is in our bucket, so it is read as ourselves. Sourcing the
          # customer's credentials first makes this a 403, and the step then finds
          # no vpc and quietly does nothing.

          vpc="$(terraform state show module.vpc.aws_vpc.this[0] 2>/dev/null                  | grep -oE 'vpc-[0-9a-f]+' | head -1 || true)"
          [ -n "$vpc" ] || { echo "no vpc in state, nothing to clean"; exit 0; }

          # The interfaces are theirs, so they are removed as them.
          [ -f "$RUNNER_TEMP/cluster-creds.sh" ] && . "$RUNNER_TEMP/cluster-creds.sh"

          for eni in $(aws ec2 describe-network-interfaces --region "$REGION"                 --filters "Name=vpc-id,Values=$vpc" "Name=status,Values=available"                 --query 'NetworkInterfaces[].NetworkInterfaceId' --output text 2>/dev/null); do
            echo "removing detached interface $eni"
            aws ec2 delete-network-interface --region "$REGION"               --network-interface-id "$eni" 2>&1 | tail -1 || true
          done

      # First pass. Allowed to fail: the interfaces that block a subnet only
      # become detached once the nodes holding them are gone, which happens
      # during this step. Sweeping before it finds nothing, which is why the
      # sweep above has never once had anything to do.
      - name: Destroy
        id: first
        continue-on-error: true
        working-directory: ${{ env.TF_DIR }}
        env:
          REGION: ${{ github.event.inputs.region }}
          ASSUME_ROLE_ARN: ${{ steps.target.outputs.assume_role_arn }}
          ASSUME_EXTERNAL_ID: ${{ steps.target.outputs.external_id }}
        run: |
          set -euo pipefail
          # Only the ones that decide *where* and *as whom*. Every other variable
          # has a default, and none of them affect what gets destroyed: terraform
          # removes what the state lists, and the rest only ever fed resource
          # names and tags. Passing the provision's values here would mean
          # keeping two lists in step forever, and getting one wrong would look
          # like a successful destroy that left the cluster running.
          terraform destroy -input=false -auto-approve \
            -var "aws_profile=" \
            -var "region=${REGION}" \
            -var "assume_role_arn=${ASSUME_ROLE_ARN}" \
            -var "assume_role_external_id=${ASSUME_EXTERNAL_ID}"

      # Now they are detached, so this is the pass that finds them.
      - name: Remove interfaces the destroy left behind
        if: steps.first.outcome == 'failure'
        working-directory: ${{ env.TF_DIR }}
        env:
          REGION: ${{ github.event.inputs.region }}
        run: |
          set -uo pipefail
          vpc="$(terraform state show module.vpc.aws_vpc.this[0] 2>/dev/null | grep -oE 'vpc-[0-9a-f]+' | head -1 || true)"
          [ -n "$vpc" ] || { echo "no vpc left in state"; exit 0; }

          [ -f "$RUNNER_TEMP/cluster-creds.sh" ] && . "$RUNNER_TEMP/cluster-creds.sh"
          for eni in $(aws ec2 describe-network-interfaces --region "$REGION" \
                --filters "Name=vpc-id,Values=$vpc" "Name=status,Values=available" \
                --query 'NetworkInterfaces[].NetworkInterfaceId' --output text 2>/dev/null); do
            echo "removing detached interface $eni"
            aws ec2 delete-network-interface --region "$REGION" --network-interface-id "$eni" 2>&1 | tail -1 || true
          done

      # The pass that has to succeed. A teardown that stops half way leaves the
      # state matching neither what is there nor what is gone.
      - name: Destroy what is left
        if: steps.first.outcome == 'failure'
        working-directory: ${{ env.TF_DIR }}
        env:
          REGION: ${{ github.event.inputs.region }}
          ASSUME_ROLE_ARN: ${{ steps.target.outputs.assume_role_arn }}
          ASSUME_EXTERNAL_ID: ${{ steps.target.outputs.external_id }}
        run: |
          set -euo pipefail
          terraform destroy -input=false -auto-approve \
            -var "aws_profile=" \
            -var "region=${REGION}" \
            -var "assume_role_arn=${ASSUME_ROLE_ARN}" \
            -var "assume_role_external_id=${ASSUME_EXTERNAL_ID}"

      - name: Confirm nothing is left
        # Runs even when the destroy failed, which is exactly when it is worth
        # reading. Without this it is skipped on failure, so the one step that
        # says what survived stays silent in the only case that matters. A real
        # failure proved it on the machine path: it went, an IAM role did not, and this
        # step never ran to say so.
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          remaining="$(terraform state list | wc -l)"
          if [ "$remaining" -ne 0 ]; then
            echo "::error::$remaining resource(s) still in state after destroy. Listed below."
            terraform state list
            # Only the ones that cost money. This used to match anything under
            # module.eks or module.vpc, so a leftover VPC and subnet, which are
            # free, were reported as still billing. That reads as an emergency
            # and is not one; the difference matters at one in the morning.
            if terraform state list | grep -qE 'aws_(nat_gateway|eip|eks_cluster|eks_node_group|instance|db_instance)\.'; then
              echo "::error::Something that costs money is still there: a gateway, an address, or the cluster itself."
            else
              echo "::warning::The cluster is gone. What remains costs nothing but will block re-using this name."
            fi
            exit 1
          fi
          echo "state is empty: every resource this deployment created is gone"

      # Written by Provision-cluster.yml after the balancer existed, so
      # Terraform never knew about it and a destroy leaves it pointing at a
      # load balancer that has gone.
      - name: Take the name back out of DNS
        if: always()
        env:
          SUBDOMAIN: ${{ github.event.inputs.subdomain }}
        run: |
          set -euo pipefail
          [ -n "$SUBDOMAIN" ] || exit 0
          zone="$(aws route53 list-hosted-zones-by-name --dns-name caytu.link. \
            --query 'HostedZones[0].Id' --output text | cut -d/ -f3)"
          existing="$(aws route53 list-resource-record-sets --hosted-zone-id "$zone" \
            --query "ResourceRecordSets[?Name=='${SUBDOMAIN}.caytu.link.'&&Type=='CNAME']" \
            --output json)"
          if [ "$(echo "$existing" | jq 'length')" -eq 0 ]; then
            echo "no record for ${SUBDOMAIN}.caytu.link, nothing to remove"
            exit 0
          fi
          aws route53 change-resource-record-sets --hosted-zone-id "$zone" \
            --change-batch "$(echo "$existing" | jq '{Changes:[{Action:"DELETE",ResourceRecordSet:.[0]}]}')"
          echo "removed ${SUBDOMAIN}.caytu.link"

      - name: What was removed
        if: always()
        run: |
          {
            echo "### Destroyed \`${{ github.event.inputs.instance_id }}\`"
            echo
            echo "State key: \`instances/${{ github.event.inputs.instance_id }}/terraform.tfstate\`"
            echo
            echo "Check the EC2 console if you want a second opinion. A failed run"
            echo "here means the cluster may still exist."
          } >> "$GITHUB_STEP_SUMMARY"
