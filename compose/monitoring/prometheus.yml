global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: node-exporter
    static_configs:
      # node-exporter runs on host network, so we scrape via the docker bridge gateway
      - targets: ['host.docker.internal:9100']

  # Application metrics — enable if the corresponding service exposes /metrics
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:5000']

  - job_name: signaling
    metrics_path: /metrics
    static_configs:
      - targets: ['signaling-server:3001']
