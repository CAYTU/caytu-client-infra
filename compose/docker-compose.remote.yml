# =============================================================================
# Remote / production overlay (single-instance Docker Compose)
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.remote.yml \
#     --env-file .env.remote \
#     up -d
#
# Or, via the CLI: `caytu-client ssh deploy` (uses --target ssh|aws-single|gcp-single)
#
# Differences vs base:
#   * pulls prebuilt images from ${IMAGE_REGISTRY} (no build contexts)
#   * NO host ports on internal services — all traffic passes through nginx
#   * nginx terminates TLS on 80/443 and reverse-proxies to internal services
#   * certbot handles Let's Encrypt renewal
#   * license state + machine-id bind mount for the backend (matches prod)
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    volumes:
      - ${BACKEND_CERTS_DIR:-/opt/caytu/backend-certs}:/app/certs:ro
      - /etc/machine-id:/etc/machine-id:ro
      - caytu-license-state:/var/lib/caytu/license

  gstreamer-recorder:
    volumes:
      - ${BACKEND_CERTS_DIR:-/opt/caytu/backend-certs}:/app/certs:ro
      - gstreamer-recordings:/tmp/recordings

  mqtt-streamer:
    volumes:
      - ${MQTT_CERTS_DIR:-/opt/caytu/mqtt-certs}:/app/certs:ro

  nginx:
    image: nginx:${NGINX_VERSION:-alpine}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-logs:/var/log/nginx
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:       { condition: service_healthy }
      frontend:      { condition: service_healthy }
      mqtt-streamer: { condition: service_healthy }
      minio:         { condition: service_healthy }
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [caytu]

  certbot:
    image: certbot/certbot:${CERTBOT_VERSION:-latest}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks: [caytu]

volumes:
  nginx-logs:
  caytu-license-state:
