# =============================================================================
# Remote / production overlay (single-instance Docker Compose)
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.remote.yml \
#     --env-file .env.remote \
#     up -d
#
# Or, via the CLI: `caytu-client ssh deploy` (uses --target ssh|aws-single|gcp-single)
#
# Differences vs base:
#   * pulls prebuilt images from ${IMAGE_REGISTRY} (no build contexts)
#   * NO host ports on internal services — all traffic passes through nginx
#   * nginx terminates TLS on 80/443 and reverse-proxies to internal services
#   * certbot handles Let's Encrypt renewal
#   * AWS IoT device certs bind-mounted into the backend (matches prod)
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # backend and mqtt-streamer mount nothing: AWS IoT device certs now come from
  # the encrypted caytu_secrets store in Mongo, not from disk.
  gstreamer-recorder:
    volumes:
      - gstreamer-recordings:/tmp/recordings

  # The one internal service that DOES publish a host port: devices publishing
  # from other LAN hosts need to reach the broker directly. Open 1885/tcp on
  # the firewall to the LAN CIDR only.
  mqtt-broker:
    ports:
      - "${MQTT_BROKER_HOST_PORT:-1885}:1885"

  # STUN/TURN can't be proxied through nginx (UDP-heavy stateful protocol) and
  # can't run behind docker's bridge NAT when the peer is *also* on this host:
  # both endpoints allocate on the same coturn and the return path collapses
  # into docker's SNAT, so relayed frames never reach the browser. Running on
  # the host network puts coturn directly on the LAN IP — same listener and
  # relay addresses no matter which side of docker the peer sits on.
  # aws-* deployments include this overlay too but never start coturn (profile
  # `turn` is off), so this stanza is a harmless no-op there.
  coturn:
    network_mode: host
    # `networks:` is invalid alongside network_mode: host. Compose merges the
    # base file's `networks: [caytu]` in — override it with an empty list so
    # the merge produces a host-only service.
    networks: !reset null

  nginx:
    image: nginx:${NGINX_VERSION:-alpine}
    # Where nginx publishes. The defaults are the whole host on the usual ports,
    # which is right whenever we are the edge. A site with IIS or its own proxy
    # in front sets these to loopback so the two do not fight for :80, and points
    # that proxy at one port rather than restating our routing rules.
    ports:
      - "${NGINX_HTTP_BIND:-80}:80"
      - "${NGINX_HTTPS_BIND:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-logs:/var/log/nginx
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # nginx loads certificates once at startup, so a certbot renewal is invisible
    # to it until something reloads. Rather than signal across containers, nginx
    # reloads itself every 6h — a no-op when nothing changed, and it guarantees a
    # renewed cert is served within 6h. Certs renew at 30 days remaining, so
    # there is an enormous margin.
    command: >
      /bin/sh -c "while :; do sleep 6h; nginx -s reload; done & nginx -g 'daemon off;'"
    depends_on:
      backend:       { condition: service_healthy }
      frontend:      { condition: service_healthy }
      mqtt-streamer: { condition: service_healthy }
      minio:         { condition: service_healthy }
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [caytu]

  certbot:
    image: certbot/certbot:${CERTBOT_VERSION:-latest}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks: [caytu]

volumes:
  nginx-logs:
