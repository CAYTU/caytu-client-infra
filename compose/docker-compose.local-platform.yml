# Opt-in overlay: let the client talk to a Caytu platform running on this same
# machine.
#
# The two stacks are separate compose projects, so each gets its own network and
# neither can resolve the other's service names. Attaching the backend to the
# platform's network is what makes http://billings-srv:4083 work instead of a
# container IP, which changes on every recreate and silently breaks the wiring.
#
# Layered automatically when CAYTU_PLATFORM_NETWORK is set in .env.local.
services:
  backend:
    networks: [caytu, caytu-platform]

networks:
  caytu-platform:
    external: true
    name: ${CAYTU_PLATFORM_NETWORK}
