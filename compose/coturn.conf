# TURN server config — used when STREAMING_PROVIDER=self-hosted.
# Enable with `--profile turn` on docker compose, or set default profiles in .env.
#
# Two settings are dynamically overridden from .env by the compose command:
#   * static-auth-secret ← TURN_SECRET       (required)
#   * external-ip        ← COTURN_EXTERNAL_IP or CAYTU_DOMAIN
# The values written here for those two are placeholders; the CLI flags win.
# If you widen `min-port` / `max-port` below, mirror the change in the coturn
# ports block of docker-compose.remote.yml.

listening-port=3478
tls-listening-port=5349

min-port=49152
max-port=49252

fingerprint

use-auth-secret
# Placeholder — the actual secret is passed as --static-auth-secret=$TURN_SECRET
# by the compose command. This line only takes effect if you run turnserver
# outside the compose stack.
static-auth-secret=caytu-turn-secret-key-change-me

realm=caytu.local

# Uncomment and generate real certs on the host if you want TLS TURN (turns:)
# cert=/etc/coturn/turn_server_cert.pem
# pkey=/etc/coturn/turn_server_pkey.pem

log-file=/var/log/coturn.log
verbose

# external-ip is now passed by the compose command as
# --external-ip=$COTURN_EXTERNAL_IP (falling back to CAYTU_DOMAIN), so leaving
# it commented here is correct. Uncomment only if you run turnserver outside
# the compose stack.
# external-ip=203.0.113.10

denied-peer-ip=0.0.0.0-0.255.255.255
allowed-peer-ip=10.0.0.0-10.255.255.255
allowed-peer-ip=172.16.0.0-172.31.255.255
allowed-peer-ip=192.168.0.0-192.168.255.255
allowed-peer-ip=127.0.0.1
allowed-peer-ip=::1

stale-nonce=600

cli-port=5766
cli-password=caytu123
