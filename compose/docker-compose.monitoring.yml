# =============================================================================
# Monitoring overlay
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.<local|remote>.yml \
#     -f docker-compose.monitoring.yml \
#     --env-file .env.<target> \
#     up -d
#
# Or, via the CLI: `caytu-client monitor up`
#
# Access on the host:
#   grafana   http://localhost:3005   (admin / ${GRAFANA_ADMIN_PASSWORD})
#   dozzle    http://localhost:8005
#   prometheus  http://localhost:9095  (metrics debug only)
#
# On remote hosts these are bound to 127.0.0.1 only — reach them via SSH tunnel:
#   caytu-client tunnel grafana
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-latest}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9095}:9090"
    restart: unless-stopped
    logging: *default-logging
    networks: [caytu]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_HOST_PORT:-3005}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging
    networks: [caytu]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:-v0.49.1}
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped
    logging: *default-logging
    networks: [caytu]

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-latest}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    logging: *default-logging
    network_mode: host

  dozzle:
    image: amir20/dozzle:${DOZZLE_VERSION:-latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_AUTH_PROVIDER=${DOZZLE_AUTH_PROVIDER:-none}
      - DOZZLE_USERNAME=${DOZZLE_USERNAME:-}
      - DOZZLE_PASSWORD=${DOZZLE_PASSWORD:-}
    ports:
      - "${DOZZLE_BIND:-127.0.0.1}:${DOZZLE_HOST_PORT:-8005}:8080"
    restart: unless-stopped
    logging: *default-logging
    networks: [caytu]

volumes:
  prometheus-data:
  grafana-data:
