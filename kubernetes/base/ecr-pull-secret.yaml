# Keeps a docker-registry Secret fresh so kubelet can pull from Caytu's ECR.
#
# Same shape as the on-prem systemd timer, translated to k8s: read the host's
# enrolment token, ask the platform for a short-lived ECR password, write it
# into a Secret every Deployment references via imagePullSecrets. ECR tokens
# last twelve hours; the CronJob runs at four-hour intervals so a single failed
# refresh still leaves eight hours of runway.
#
# The Job with the same body runs once at apply time so the first pull after a
# fresh `kubectl apply` doesn't wait for the CronJob's next tick (kubelet
# will retry the pull once the Secret exists, so at worst deployments show
# ImagePullBackOff for a minute).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caytu-ecr-refresh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: caytu-ecr-refresh
rules:
  # `apply` in the container needs get on the Secret to compare, then
  # create-or-patch. resourceNames narrows create/patch to just the one Secret
  # we own so a bug in the script cannot rewrite anything else in the namespace.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [caytu-ecr-pull-secret]
    verbs: [get, patch, update]
  # `create` cannot be resourceName-scoped in RBAC — the object doesn't exist
  # yet. Kept as a separate rule so the scope of the widened permission is
  # obvious in the review.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: caytu-ecr-refresh
subjects:
  - kind: ServiceAccount
    name: caytu-ecr-refresh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: caytu-ecr-refresh
---
# One-shot at apply time. Otherwise the first pull after a fresh install waits
# until the CronJob's next scheduled tick, which could be up to four hours.
apiVersion: batch/v1
kind: Job
metadata:
  name: caytu-ecr-refresh-initial
  annotations:
    # Kustomize will replace on re-apply if the pod spec changes. A completed
    # Job with an unchanged spec is a no-op, which is what we want.
    kubernetes.io/description: "Initial ECR pull-secret; the CronJob keeps it fresh after."
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ecr-refresh
    spec:
      restartPolicy: OnFailure
      serviceAccountName: caytu-ecr-refresh
      containers:
        - name: refresh
          image: alpine/k8s:1.29.4
          env:
            - name: CAYTU_METERING_TOKEN
              valueFrom: { secretKeyRef: { name: caytu-secrets, key: CAYTU_METERING_TOKEN } }
            - name: CAYTU_PLATFORM_URL
              valueFrom: { secretKeyRef: { name: caytu-secrets, key: CAYTU_PLATFORM_URL } }
          command: [/bin/sh, -c]
          args:
            - |
              set -euo pipefail
              URL="${CAYTU_PLATFORM_URL%/}/api/billings/instances/registry-credentials"
              BODY=$(curl -fsS -m 20 -H "Authorization: Bearer $CAYTU_METERING_TOKEN" "$URL")
              U=$(echo "$BODY" | jq -r .username)
              P=$(echo "$BODY" | jq -r .password)
              R=$(echo "$BODY" | jq -r .registry)
              if [ -z "$U" ] || [ -z "$P" ] || [ -z "$R" ]; then
                echo "platform returned no credential" >&2
                echo "$BODY" >&2
                exit 1
              fi
              # `dry-run=client -o yaml | kubectl apply` is the idempotent
              # upsert for Secrets: create when missing, patch when present.
              kubectl create secret docker-registry caytu-ecr-pull-secret \
                --docker-server="$R" --docker-username="$U" --docker-password="$P" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "refreshed caytu-ecr-pull-secret for $R"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: caytu-ecr-refresh
spec:
  # Every 4h. ECR tokens live 12h; refreshing at 4h gives two chances before a
  # deployment's pulls start failing.
  schedule: "0 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/component: ecr-refresh
        spec:
          restartPolicy: OnFailure
          serviceAccountName: caytu-ecr-refresh
          containers:
            - name: refresh
              image: alpine/k8s:1.29.4
              env:
                - name: CAYTU_METERING_TOKEN
                  valueFrom: { secretKeyRef: { name: caytu-secrets, key: CAYTU_METERING_TOKEN } }
                - name: CAYTU_PLATFORM_URL
                  valueFrom: { secretKeyRef: { name: caytu-secrets, key: CAYTU_PLATFORM_URL } }
              command: [/bin/sh, -c]
              args:
                - |
                  set -euo pipefail
                  URL="${CAYTU_PLATFORM_URL%/}/api/billings/instances/registry-credentials"
                  BODY=$(curl -fsS -m 20 -H "Authorization: Bearer $CAYTU_METERING_TOKEN" "$URL")
                  U=$(echo "$BODY" | jq -r .username)
                  P=$(echo "$BODY" | jq -r .password)
                  R=$(echo "$BODY" | jq -r .registry)
                  if [ -z "$U" ] || [ -z "$P" ] || [ -z "$R" ]; then
                    echo "platform returned no credential" >&2
                    echo "$BODY" >&2
                    exit 1
                  fi
                  kubectl create secret docker-registry caytu-ecr-pull-secret \
                    --docker-server="$R" --docker-username="$U" --docker-password="$P" \
                    --dry-run=client -o yaml | kubectl apply -f -
                  echo "refreshed caytu-ecr-pull-secret for $R"
