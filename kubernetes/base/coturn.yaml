# coturn — removed in aws-eks overlay (KVS handles ICE).
# In self-managed / gcp-gke it runs with hostNetwork to expose the full ephemeral
# UDP range without needing hostPort loops or MetalLB.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
data:
  turnserver.conf: |
    listening-port=3478
    tls-listening-port=5349
    min-port=49152
    max-port=49252
    fingerprint
    use-auth-secret
    # static-auth-secret is passed as env below, this line is a placeholder
    realm=caytu.local
    log-file=/var/log/coturn.log
    verbose
    denied-peer-ip=0.0.0.0-0.255.255.255
    allowed-peer-ip=10.0.0.0-10.255.255.255
    allowed-peer-ip=172.16.0.0-172.31.255.255
    allowed-peer-ip=192.168.0.0-192.168.255.255
    stale-nonce=600
---
apiVersion: v1
kind: Service
metadata:
  name: coturn
  labels:
    app: coturn
spec:
  # Type patched per overlay: LoadBalancer on cloud, NodePort on self-managed
  # (or hostNetwork mode entirely — coturn plays poorly with double NAT)
  type: ClusterIP
  selector:
    app: coturn
  ports:
    - { name: turn-tcp,     port: 3478, targetPort: 3478, protocol: TCP }
    - { name: turn-udp,     port: 3478, targetPort: 3478, protocol: UDP }
    - { name: turn-tls-tcp, port: 5349, targetPort: 5349, protocol: TCP }
    - { name: turn-tls-udp, port: 5349, targetPort: 5349, protocol: UDP }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
spec:
  replicas: 1  # stateful UDP; scale-out requires proper session hashing
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      # Overlay patches: self-managed uses hostNetwork: true here to expose 49152-49252/udp
      containers:
        - name: coturn
          image: coturn/coturn:latest
          args:
            - -c
            - /etc/coturn/turnserver.conf
            - --static-auth-secret
            - $(TURN_SECRET)
          env:
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef: { name: caytu-secrets, key: TURN_SECRET }
          ports:
            - { name: turn-tcp,     containerPort: 3478, protocol: TCP }
            - { name: turn-udp,     containerPort: 3478, protocol: UDP }
            - { name: turn-tls-tcp, containerPort: 5349, protocol: TCP }
            - { name: turn-tls-udp, containerPort: 5349, protocol: UDP }
          volumeMounts:
            - name: config
              mountPath: /etc/coturn
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: config
          configMap:
            name: coturn-config
