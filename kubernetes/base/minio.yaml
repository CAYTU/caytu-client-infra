apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1  # scale to 4 for erasure-coded mode; needs additional args
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      # The base kustomization injects the ECR pull secret into Deployments
      # only; MinIO is a StatefulSet, so it names the secret itself.
      imagePullSecrets:
        - name: caytu-ecr-pull-secret
      containers:
        - name: minio
          # Caytu's multi-arch mirror of minio/minio (amd64 + arm64): MinIO no
          # longer publishes community images.
          image: 688544396352.dkr.ecr.us-east-1.amazonaws.com/caytu-client-minio:RELEASE.2025-09-07T16-13-09Z
          args: [server, /data, --console-address, ":9001"]
          ports:
            - { containerPort: 9000, name: api }
            - { containerPort: 9001, name: console }
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: caytu-secrets, key: MINIO_ROOT_USER }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: caytu-secrets, key: MINIO_ROOT_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "2Gi"   }
          readinessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 60
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 100Gi
# No minio-setup Job: minio/mc is no longer published, and the backend creates
# every missing bucket at startup (initializeBuckets), making only logo and
# audio-alerts public-read.
