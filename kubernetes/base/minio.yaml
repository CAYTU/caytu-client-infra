apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1  # scale to 4 for erasure-coded mode; needs additional args
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: [server, /data, --console-address, ":9001"]
          ports:
            - { containerPort: 9000, name: api }
            - { containerPort: 9001, name: console }
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: caytu-secrets, key: MINIO_ROOT_USER }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: caytu-secrets, key: MINIO_ROOT_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "2Gi"   }
          readinessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 60
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 100Gi
---
# One-shot Job that creates buckets + policies. Idempotent (--ignore-existing).
# Runs after MinIO is up via initContainer wait.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  annotations:
    # rerun on any change to the script by bumping this
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z minio 9000; do echo waiting for minio; sleep 3; done
      containers:
        - name: mc
          image: minio/mc:latest
          env:
            - name: MC_HOST_myminio
              value: "http://$(MU):$(MP)@minio:9000"
            - name: MU
              valueFrom: { secretKeyRef: { name: caytu-secrets, key: MINIO_ROOT_USER } }
            - name: MP
              valueFrom: { secretKeyRef: { name: caytu-secrets, key: MINIO_ROOT_PASSWORD } }
          command:
            - sh
            - -c
            - |
              set -e
              for b in profiles blocs devices readings audio-alerts logo kpi-media video-recordings knowledge-base dashboard-media; do
                mc mb --ignore-existing myminio/$b
              done
              mc anonymous set download myminio/logo || true
              mc anonymous set download myminio/audio-alerts || true
              for b in profiles blocs dashboard-media video-recordings kpi-media knowledge-base devices readings; do
                mc anonymous set none myminio/$b || true
              done
              echo "MinIO setup done"
