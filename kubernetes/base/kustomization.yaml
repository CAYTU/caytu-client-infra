apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: caytu-client

commonLabels:
  app.kubernetes.io/part-of: caytu-client

resources:
  - namespace.yaml
  - configmap.yaml
  - mongodb.yaml
  - redis.yaml
  - minio.yaml
  - backend.yaml
  - frontend.yaml
  - signaling-server.yaml
  - gstreamer-recorder.yaml
  - mqtt-streamer.yaml
  - coturn.yaml
  - minio-proxy.yaml
  - ingress.yaml
  - ecr-pull-secret.yaml

# Every app Deployment pulls from Caytu's ECR. kubelet needs a docker-registry
# Secret; caytu-ecr-pull-secret is refreshed by the Job + CronJob in
# ecr-pull-secret.yaml. Inject the pull secret into every Deployment here
# instead of copy-pasting it into each manifest — a new deployment only has to
# name itself in `resources:` above to pick it up.
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: caytu-ecr-pull-secret

# Overlays supply the secrets via secretGenerator (envs: [secrets.env]).
# The base intentionally has none — trying to apply the base alone will fail
# with "Secret caytu-secrets not found", which is the correct behavior.

# Overlays swap images with kustomize images: — placeholder tags here.
