apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  clusterIP: None  # headless — required for StatefulSet DNS
  # Publish the pod's DNS name before it is ready.
  #
  # Without this the deployment deadlocks and cannot recover on its own. A
  # headless service only publishes ready endpoints, mongo is only ready once
  # the replica set is initiated, and initiating it requires resolving
  # mongodb-0.mongodb, which does not exist until the endpoint is published.
  # The probe sat there failing on "Name or service not known" forever.
  publishNotReadyAddresses: true
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1  # single-node replica set matches the compose stack; scale via overlay if you need HA
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: mongo:8.2
          args:
            - mongod
            - --bind_ip_all
            - --replSet
            - rs0
          ports:
            - containerPort: 27017
              name: mongo
          env:
            - name: MONGO_INITDB_DATABASE
              value: caytu
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "4Gi" }
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  mongosh --quiet --eval 'try { rs.status().ok } catch(e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb-0.mongodb:27017"}]}).ok }'
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
            initialDelaySeconds: 60
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 50Gi
