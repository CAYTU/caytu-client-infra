apiVersion: v1
kind: Service
metadata:
  name: mqtt-streamer
  labels:
    app: mqtt-streamer
spec:
  selector:
    app: mqtt-streamer
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-streamer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mqtt-streamer
  template:
    metadata:
      labels:
        app: mqtt-streamer
    spec:
      terminationGracePeriodSeconds: 45  # let in-flight MQTT messages complete
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: mqtt-streamer } }
      containers:
        - name: streamer
          image: caytu-client/mqtt-streamer:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef: { name: caytu-shared }
            - secretRef:    { name: caytu-secrets }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi"   }
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 20"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mqtt-streamer
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mqtt-streamer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mqtt-streamer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mqtt-streamer
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
